# Run tests (integration + optional E2E with Ollama or cloud LLM)
name: Test
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build cback
        run: npm run build --workspace=packages/cback

      # Integration tests (run-tool, no LLM). For E2E chat tests: set OLLAMA_E2E=1
      # and add steps to install/start Ollama and pull a model (see docs/github-actions-llm-ci.md).
      - name: Run prompt-driven tests
        env:
          NODE_ENV: test
        run: npm test -- test/routers/cback/chat-prompt.spec.js
